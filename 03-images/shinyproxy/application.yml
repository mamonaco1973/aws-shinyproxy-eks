# ==============================================================================
# application.yml - ShinyProxy Configuration
# ------------------------------------------------------------------------------
# Purpose:
#   - Authenticate users against the mini-AD domain over LDAP.
#   - Launch one pod per user session in the EKS cluster.
#   - Proxy the browser (HTTP + WebSocket) to that pod's IP.
#
# Configuration Model:
#   This file is baked into the image and is identical for every deployment.
#   Everything environment-specific arrives as ${...} placeholders, which
#   Spring resolves from the ShinyProxy pod's environment (see 05-shinyproxy).
#   The Kubernetes object names below (the "efs" claim, the "ldap-bind"
#   secret) are fixed by 05-shinyproxy.
# ==============================================================================

server:
  # The ALB terminates TLS. Without this, ShinyProxy builds its redirects
  # (e.g. to /login) as http:// and the browser bounces off port 80.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true

proxy:
  title: Development Environment
  port: 8080
  landing-page: /

  # ----------------------------------------------------------------------------
  # Look and feel
  # ----------------------------------------------------------------------------
  # Templates found here replace ShinyProxy's own; anything missing falls back
  # to the stock page. /assets/** is served from <template-path>/assets.
  # See templates/ in this directory.
  template-path: /opt/shinyproxy/templates/theme
  favicon-path: /opt/shinyproxy/templates/theme/assets/favicon.svg

  # ----------------------------------------------------------------------------
  # Session lifetime
  # ----------------------------------------------------------------------------
  # The ShinyProxy page sends heartbeats while the tab is open. A session is
  # reclaimed 30 minutes after the last one (tab closed, laptop asleep), and
  # in any case after 12 hours, so no session pod runs forever.
  heartbeat-rate: 10000
  heartbeat-timeout: 1800000
  default-proxy-max-lifetime: 720

  # app-admins see every running session under /admin.
  admin-groups: app-admins

  # ----------------------------------------------------------------------------
  # Authentication - LDAP against Samba AD
  # ----------------------------------------------------------------------------
  # Searches are scoped to CN=Users: searching from the domain root makes AD
  # return referrals (DomainDnsZones, ForestDnsZones) that Spring LDAP reports
  # as a failed login. Samba accepts plain simple binds here because the
  # mini-AD module sets "ldap server require strong auth = no".
  authentication: ldap
  ldap:
    url: "${LDAP_URL}/${LDAP_BASE_DN}"
    user-search-base: CN=Users
    user-search-filter: "(&(objectClass=user)(sAMAccountName={0}))"
    group-search-base: CN=Users
    group-search-filter: "(&(objectClass=group)(member={0}))"
    manager-dn: ${LDAP_BIND_DN}
    manager-password: ${LDAP_BIND_PASSWORD}

  # ----------------------------------------------------------------------------
  # Container backend - Kubernetes (EKS Auto Mode)
  # ----------------------------------------------------------------------------
  # ShinyProxy runs inside the cluster, so it uses its service account and
  # reaches session pods directly on their pod IPs (internal-networking).
  # Sessions run in the "sessions" node pool (8 vCPU nodes, 05-shinyproxy/
  # node_pool.tf), which they reach with this selector and the toleration in
  # the pod patches below. A session that needs a new node waits for Auto
  # Mode to launch one and pull a ~1 GB image; give it five minutes.
  container-backend: kubernetes
  kubernetes:
    internal-networking: true
    namespace: ${SESSION_NAMESPACE}
    image-pull-policy: IfNotPresent
    node-selector: kubernetes.io/arch=amd64,karpenter.sh/nodepool=sessions
    pod-wait-time: 300000

  # ----------------------------------------------------------------------------
  # Apps
  # ----------------------------------------------------------------------------
  # Each spec is one tile on the landing page. access-groups decides who sees
  # it: vscode-users get the two VS Code sizes, rstudio-users get RStudio.
  # Each user may run one session of each app.
  #
  # Requests equal limits, so every session gets guaranteed CPU and memory.
  #
  # The pod patches, shared by every spec:
  #   - mount the EFS claim at /home (its home/ directory) and /efs (its root);
  #     ShinyProxy's own container-volumes would be hostPath volumes
  #   - tolerate the sessions node pool's taint
  #   - keep the namespace's service account token out of the pod, so the
  #     user has no credentials for the Kubernetes API
  #   - stop Auto Mode from evicting a live session to consolidate nodes
  #
  # LDAP_BIND_PASSWORD is a secretKeyRef: ShinyProxy puts a reference to the
  # ldap-bind secret in the pod spec, never the value.
  specs:
    - id: vscode
      display-name: VS Code
      description: 1 vCPU, 4 GB memory
      access-groups: vscode-users
      container-image: ${VSCODE_IMAGE}
      container-cpu-request: 1
      container-cpu-limit: 1
      container-memory-request: 4Gi
      container-memory-limit: 4Gi
      container-env: &session-env
        LDAP_URL: ${LDAP_URL}
        LDAP_BASE_DN: ${LDAP_BASE_DN}
        LDAP_BIND_DN: ${LDAP_BIND_DN}
        LDAP_BIND_PASSWORD: secretKeyRef:ldap-bind:password
      kubernetes-pod-patches: &session-patches |
        - op: add
          path: /spec/volumes
          value:
            - name: efs
              persistentVolumeClaim:
                claimName: efs
        - op: add
          path: /spec/containers/0/volumeMounts
          value:
            - name: efs
              mountPath: /home
              subPath: home
            - name: efs
              mountPath: /efs
        - op: add
          path: /spec/tolerations
          value:
            - key: shinyproxy/session
              operator: Equal
              value: "true"
              effect: NoSchedule
        - op: add
          path: /spec/automountServiceAccountToken
          value: false
        - op: add
          path: /metadata/annotations/karpenter.sh~1do-not-disrupt
          value: "true"
      port: 8080

    - id: vscode-large
      display-name: VS Code (large)
      description: 4 vCPU, 16 GB memory
      access-groups: vscode-users
      container-image: ${VSCODE_IMAGE}
      container-cpu-request: 4
      container-cpu-limit: 4
      container-memory-request: 16Gi
      container-memory-limit: 16Gi
      container-env: *session-env
      kubernetes-pod-patches: *session-patches
      port: 8080

    - id: rstudio
      display-name: RStudio
      description: 2 vCPU, 8 GB memory
      access-groups: rstudio-users
      container-image: ${RSTUDIO_IMAGE}
      container-cpu-request: 2
      container-cpu-limit: 2
      container-memory-request: 8Gi
      container-memory-limit: 8Gi
      container-env: *session-env
      kubernetes-pod-patches: *session-patches
      port: 8787
